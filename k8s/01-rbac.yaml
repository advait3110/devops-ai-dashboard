# The backend pod talks to the Kubernetes API with this ServiceAccount.
# Principle of least privilege: read-only access, plus "patch" on deployments
# so the "Restart" button (rollout restart) works. Remove "patch" to make the
# dashboard strictly read-only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-ai-backend
  namespace: devops-ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devops-ai-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "events", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devops-ai-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devops-ai-reader
subjects:
  - kind: ServiceAccount
    name: devops-ai-backend
    namespace: devops-ai

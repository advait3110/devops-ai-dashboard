# DO NOT commit real values. Create the secret from the command line instead:
#
#   kubectl -n devops-ai create secret generic devops-ai-secrets \
#     --from-literal=GEMINI_API_KEY=your-key \
#     --from-literal=GITHUB_TOKEN=your-token
#
# (This file only documents the expected keys; it is not applied by default.)
apiVersion: v1
kind: Secret
metadata:
  name: devops-ai-secrets
  namespace: devops-ai
type: Opaque
stringData:
  GEMINI_API_KEY: "replace-me"
  GITHUB_TOKEN: ""
  JENKINS_TOKEN: ""

# Prometheus scrape configuration.
# Prometheus PULLS metrics from each target every scrape_interval.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # Prometheus monitors itself.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host metrics (CPU, memory, disk, network) from node-exporter.
  # With Docker Desktop on Windows this is the Docker VM; on Linux it is your machine.
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # The DevOps AI Dashboard backend (/metrics from prometheus_client).
  # When the backend runs on your laptop instead of in compose,
  # change the target to host.docker.internal:8000
  - job_name: devops-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  # OPTIONAL - real Windows host metrics:
  # install windows_exporter (https://github.com/prometheus-community/windows_exporter)
  # on Windows, then uncomment:
  # - job_name: windows-host
  #   static_configs:
  #     - targets: ["host.docker.internal:9182"]

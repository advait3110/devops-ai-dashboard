# Prometheus alerting rules. The dashboard reads firing alerts from
# GET /api/v1/alerts and shows them on the Alerts page (source "prometheus").
groups:
  - name: devops-ai
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Scrape target {{ $labels.job }} ({{ $labels.instance }}) is down"

      - alert: HostHighCpu
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "CPU above 85% on {{ $labels.instance }} ({{ $value | printf \"%.0f\" }}%)"

      - alert: HostLowMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Less than 10% memory available on {{ $labels.instance }}"

      - alert: HostDiskAlmostFull
        # Read-only filesystems (e.g. WSL2 system images) are always "100 % full", so ignore them.
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 < 10 unless on(instance, device, mountpoint) node_filesystem_readonly == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} has less than 10% free"

      - alert: DashboardApiErrors
        expr: sum(rate(devops_dashboard_http_requests_total{status=~"5.."}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DevOps AI backend is returning 5xx errors"
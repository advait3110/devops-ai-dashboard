# ------------------------------------------------------------------
# Nginx: serves the built React app AND acts as a reverse proxy.
#
#   browser --> nginx :80 --> /            static files from /usr/share/nginx/html
#                         --> /api/...     proxied to the FastAPI backend
#
# Because the browser only ever talks to ONE origin, no CORS is needed
# and the backend is not exposed directly.
# ------------------------------------------------------------------
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses (JS bundle ~370 KB -> ~115 KB).
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Basic security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API -> backend. "backend" is the docker-compose / Kubernetes service name.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # AI answers can take a while
    }

    # Vite puts content-hashed files in /assets, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Liveness check for Docker/Kubernetes.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
